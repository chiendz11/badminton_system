[project]
name = "badminton-ai-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.35,<1", "pydantic-settings>=2.10,<3", "langgraph>=1,<2", "langchain-openai>=1,<2", "langgraph-checkpoint-postgres>=3,<4", "sqlalchemy>=2.0,<2.1", "alembic>=1.16,<2", "psycopg[binary,pool]>=3.2,<4", "httpx>=0.28,<1", "PyJWT>=2.10,<3", "prometheus-client>=0.23,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2", "jsonschema>=4.25,<5", "aiosqlite>=0.21,<1", "langgraph-checkpoint-sqlite>=3,<4", "testcontainers[postgres]>=4.13,<5"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
[tool.badminton-ci.commands]
lint = "ruff check app tests evaluation alembic"
typecheck = "mypy app"
unit = "pytest tests/unit -q"
contract = "pytest tests/contract -q"
integration = "pytest tests/integration -q"
golden = "python -m evaluation.evaluate"
smoke = "pytest tests/smoke -q"
