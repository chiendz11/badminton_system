services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking_dev
      POSTGRES_DB: booking
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U booking -d booking
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: services/booking-core/Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://booking:booking_dev@postgres:5432/booking
    command:
      - sh
      - -c
      - pnpm --filter @badminton/booking-core prisma:migrate:deploy && pnpm --filter
        @badminton/booking-core seed
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: services/booking-core/Dockerfile
    environment:
      DATABASE_URL: postgresql://booking:booking_dev@postgres:5432/booking
      JWT_SECRET: local-development-only-change-me-32-chars
      JWT_ISSUER: badminton-identity
      JWT_AUDIENCE: badminton-system
      NODE_ENV: development
      ENABLE_DEMO_AUTH: "true"
      METRICS_TOKEN: local-monitoring-only
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:8082,http://localhost:8083,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8082,http://127.0.0.1:8083
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
  gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 8081
      BOOKING_CORE_URL: http://api:3000
      JWT_SECRET: local-development-only-change-me-32-chars
      JWT_ISSUER: badminton-identity
      JWT_AUDIENCE: badminton-system
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:8082,http://localhost:8083,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8082,http://127.0.0.1:8083
      METRICS_TOKEN: local-gateway-monitoring-only
      AI_SERVICE_URL: http://ai:8000
      AI_UPSTREAM_TIMEOUT_MS: "45000"
    ports:
      - 127.0.0.1:8081:8081
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:8081/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CLIENT_ID: ${VITE_CLIENT_ID:-}
    ports:
      - 127.0.0.1:8082:80
    environment:
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://gateway:8081}
    depends_on:
      gateway:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_CLIENT_ID: ${VITE_CLIENT_ID:-}
    ports:
      - 127.0.0.1:8083:80
    environment:
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://gateway:8081}
    depends_on:
      gateway:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
  ai-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai_dev
      POSTGRES_DB: ai
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - ai-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ai -d ai
      interval: 3s
      timeout: 3s
      retries: 20
  ai-migrate:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    environment: &ai-environment
      APP_ENV: development
      AI_DATABASE_URL: postgresql+psycopg://ai:ai_dev@ai-postgres:5432/ai
      BOOKING_CORE_URL: http://api:3000
      JWT_SECRET: local-development-only-change-me-32-chars
      JWT_ISSUER: badminton-identity
      JWT_AUDIENCE: badminton-system
      METRICS_TOKEN: local-ai-monitoring-only
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_OFFLINE: ${AI_OFFLINE:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.migrate
    depends_on:
      ai-postgres:
        condition: service_healthy
  ai:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    environment: *ai-environment
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')
      interval: 10s
      timeout: 5s
      retries: 10
    extra_hosts:
      - host.docker.internal:host-gateway
volumes:
  booking-data: {}
  ai-data: {}
