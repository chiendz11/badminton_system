services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking_dev
      POSTGRES_DB: booking
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U booking -d booking
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: services/booking-core/Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://booking:booking_dev@postgres:5432/booking
    command:
      - sh
      - -c
      - pnpm --filter @badminton/booking-core prisma:migrate:deploy && pnpm --filter
        @badminton/booking-core seed
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: services/booking-core/Dockerfile
    environment:
      DATABASE_URL: postgresql://booking:booking_dev@postgres:5432/booking
      JWT_SECRET: local-development-only-change-me-32-chars
      JWT_ISSUER: badminton-identity
      JWT_AUDIENCE: badminton-system
      NODE_ENV: development
      ENABLE_DEMO_AUTH: "true"
      METRICS_TOKEN: local-monitoring-only
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:8082,http://localhost:8083
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CLIENT_ID: ${VITE_CLIENT_ID:-}
    ports:
      - 127.0.0.1:8082:80
    environment:
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - host.docker.internal:host-gateway
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_CLIENT_ID: ${VITE_CLIENT_ID:-}
    ports:
      - 127.0.0.1:8083:80
    environment:
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - host.docker.internal:host-gateway
volumes:
  booking-data: {}
