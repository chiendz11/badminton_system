name: Reusable Contract CI
'on':
  workflow_call:
    inputs:
      component_name:
        type: string
        required: true
      component_path:
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    name: ${{ inputs.component_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned contract validation tools
        run: python -m pip install -r .github/ci/requirements.txt
      - name: Validate OpenAPI, events and AI-tool JSON Schemas
        run: python .github/scripts/validate_contracts.py "$CONTRACT_PATH"
        env:
          CONTRACT_PATH: ${{ inputs.component_path }}
