name: Build and Publish Images

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated or "all")'
        required: true
        default: 'all'
  push:
    branches:
      - main
    paths:
      - 'services/booking-core/**'
      - 'services/ai-service/**'
      - 'services/api-gateway/**'
      - 'services/content-service/**'
      - 'services/identity/**'
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'packages/**'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: booking-core
            context: .
            dockerfile: services/booking-core/Dockerfile
            image: badminton-booking-core
            target: ""
            build_args: ""
          - name: booking-core-migrations
            context: .
            dockerfile: services/booking-core/Dockerfile
            image: badminton-booking-core-migrations
            target: build
            build_args: ""
          - name: ai-service
            context: .
            dockerfile: services/ai-service/Dockerfile
            image: badminton-ai-service
            target: ""
            build_args: ""
          - name: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
            image: badminton-api-gateway
            target: ""
            build_args: ""
          - name: content-service
            context: .
            dockerfile: services/content-service/Dockerfile
            image: badminton-content-service
            target: ""
            build_args: ""
          - name: identity-service
            context: .
            dockerfile: services/identity/Dockerfile
            image: badminton-identity-service
            target: ""
            build_args: ""
          - name: identity-service-migrations
            context: .
            dockerfile: services/identity/Dockerfile
            image: badminton-identity-service-migrations
            target: migrate
            build_args: ""
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
            image: badminton-web
            target: ""
            build_args: ""
          - name: admin
            context: .
            dockerfile: apps/admin/Dockerfile
            image: badminton-admin
            target: ""
            build_args: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if service selected
        id: check_select
        run: |
          SERVICES="${{ github.event.inputs.services || 'all' }}"
          if [ "$SERVICES" = "all" ] || echo ",$SERVICES," | grep -q ",${{ matrix.name }},"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check_select.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check_select.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        if: steps.check_select.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target != '' && matrix.target || null }}
          build-args: ${{ matrix.build_args != '' && matrix.build_args || null }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

