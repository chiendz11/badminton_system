name: Reusable Backend CI
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: true
        type: string
      package_manager:
        type: string
        default: npm
      lockfile:
        type: string
        default: package-lock.json
      dockerfile:
        type: string
        default: Dockerfile
permissions:
  contents: read
jobs:
  verify:
    name: ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      PACKAGE_MANAGER: ${{ inputs.package_manager }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.service_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pnpm when required
        if: inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: ${{ inputs.package_manager }}
          cache-dependency-path: ${{ inputs.service_path }}/${{ inputs.lockfile }}
      - name: Validate CI contract
        run: node "$GITHUB_WORKSPACE/.github/scripts/check_contract.mjs" backend
      - name: Install locked dependencies
        run: |
          case "$PACKAGE_MANAGER" in
            npm) npm ci --no-audit --no-fund ;;
            pnpm) pnpm install --frozen-lockfile ;;
            *) echo "Unsupported package manager" >&2; exit 1 ;;
          esac
      - name: Generate Prisma client when declared
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { scripts = {} } = JSON.parse(readFileSync('package.json'));
          if (scripts['prisma:generate']) execFileSync(process.env.PACKAGE_MANAGER, ['run', 'prisma:generate'], { stdio: 'inherit' });
          NODE
      - name: Lint without modifying source
        run: '"$PACKAGE_MANAGER" run lint'
      - name: Unit tests
        run: '"$PACKAGE_MANAGER" run test:unit'
        env:
          NODE_ENV: test
      - name: Service integration tests
        run: '"$PACKAGE_MANAGER" run test:integration'
        env:
          NODE_ENV: test
      - name: Build application when declared
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { scripts = {} } = JSON.parse(readFileSync('package.json'));
          if (scripts.build) execFileSync(process.env.PACKAGE_MANAGER, ['run', 'build'], { stdio: 'inherit' });
          NODE
      - name: Validate Docker image (no push)
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: docker build --file "$DOCKERFILE" --tag "badminton/${SERVICE_NAME}:${GITHUB_SHA}" .
