name: Reusable Node CI
'on':
  workflow_call:
    inputs:
      component_name:
        type: string
        required: true
      component_path:
        type: string
        required: true
      package_manager:
        type: string
        required: true
      package_manager_version:
        type: string
        required: true
      install_path:
        type: string
        required: true
      lockfile:
        type: string
        required: true
      node_version:
        type: string
        required: true
      database:
        type: string
        default: none
      prisma:
        type: boolean
        default: false
      docker:
        type: boolean
        default: true
      dockerfile:
        type: string
        required: true
      docker_context:
        type: string
        default: .
permissions:
  contents: read
jobs:
  verify:
    name: ${{ inputs.component_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      PACKAGE_MANAGER: ${{ inputs.package_manager }}
      PACKAGE_MANAGER_VERSION: ${{ inputs.package_manager_version }}
      INSTALL_PATH: ${{ inputs.install_path }}
      LOCKFILE: ${{ inputs.lockfile }}
      PRISMA: ${{ inputs.prisma }}
      COMPONENT_NAME: ${{ inputs.component_name }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.component_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate Node CI contract
        run: node "$GITHUB_WORKSPACE/.github/scripts/check_node_contract.mjs" node
      - name: Set up pnpm
        if: inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ inputs.package_manager_version }}
          run_install: false
          package_json_file: ${{ inputs.install_path }}/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}
          cache-dependency-path: ${{ inputs.install_path }}/${{ inputs.lockfile }}
      - name: Install frozen workspace dependencies
        run: |-
          case "$PACKAGE_MANAGER" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm) npm ci --no-audit --no-fund ;;
            *) echo 'Unsupported package manager' >&2; exit 1 ;;
          esac
        working-directory: ${{ inputs.install_path }}
      - name: Start isolated PostgreSQL for Prisma
        run: bash "$GITHUB_WORKSPACE/.github/scripts/prisma_database.sh" start
        if: inputs.prisma
      - name: Validate and generate Prisma client
        run: |-
          "$PACKAGE_MANAGER" run prisma:validate
          "$PACKAGE_MANAGER" run prisma:generate
        if: inputs.prisma
      - name: Lint
        run: '"$PACKAGE_MANAGER" run lint'
      - name: Typecheck
        run: '"$PACKAGE_MANAGER" run typecheck'
      - name: Unit tests
        run: '"$PACKAGE_MANAGER" run test:unit'
        env:
          NODE_ENV: test
      - name: Validate consumer/provider contracts
        run: '"$PACKAGE_MANAGER" run test:contract'
        env:
          NODE_ENV: test
      - name: Apply committed Prisma migrations
        run: '"$PACKAGE_MANAGER" run prisma:migrate:deploy'
        if: inputs.prisma
      - name: Component integration tests
        run: '"$PACKAGE_MANAGER" run test:integration'
        env:
          NODE_ENV: test
      - name: Build component
        run: '"$PACKAGE_MANAGER" run build'
      - name: Docker build and security scan
        if: inputs.docker
        uses: ./.github/actions/build-scan
        with:
          name: ${{ inputs.component_name }}
          dockerfile: ${{ inputs.dockerfile }}
          context: ${{ inputs.docker_context }}
      - name: Clean up isolated PostgreSQL
        run: bash "$GITHUB_WORKSPACE/.github/scripts/prisma_database.sh" cleanup
        if: always() && inputs.prisma
