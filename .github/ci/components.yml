# Enable only implemented boundaries with their own tests and contracts.
version: 1
configuration_only: false
global_paths:
  - .github/**
  - tsconfig.base.json
  - eslint.config.mjs
  - .dockerignore
defaults:
  node_version: "22"
  package_manager: pnpm
  package_manager_version: 10.25.0
  install_path: .
  lockfile: pnpm-lock.yaml
  python_version: "3.12"
  uv_version: 0.8.22
components:
  auth_contracts:
    path: packages/auth-contracts
    runtime: shared
    depends_on: []
    enabled: true
  booking_contracts:
    path: packages/booking-contracts
    runtime: shared
    depends_on: []
    enabled: true
  observability:
    path: packages/observability
    runtime: shared
    depends_on: []
    enabled: true
  booking_api:
    path: contracts/booking
    runtime: contract
    depends_on: []
    enabled: true
  events:
    path: contracts/events
    runtime: contract
    depends_on: []
    enabled: true
  ai_tools:
    path: contracts/ai-tools
    runtime: contract
    depends_on: []
    enabled: true
  gateway_api:
    path: contracts/gateway
    runtime: contract
    depends_on: []
    enabled: true
  api_gateway:
    path: services/api-gateway
    runtime: node
    database: none
    depends_on:
      - booking_core
      - booking_api
      - gateway_api
      - auth_contracts
      - observability
      - ai_tools
    docker: true
    enabled: true
  booking_core:
    path: services/booking-core
    runtime: node
    database: postgres
    prisma: true
    depends_on:
      - booking_api
      - events
      - auth_contracts
      - booking_contracts
      - observability
    docker: true
    enabled: true
  ai:
    path: services/ai-service
    runtime: python
    install_path: services/ai-service
    lockfile: uv.lock
    depends_on:
      - booking_api
      - ai_tools
      - booking_core
      - auth_contracts
    docker: true
    golden:
      schema_validity: 1.0
      constraint_f1: 0.9
      critical_field_accuracy: 0.95
    enabled: true
    python_version: "3.12"
  frontend:
    path: apps/web
    runtime: web
    depends_on:
      - gateway_api
      - ai_tools
    docker: false
    enabled: true
  admin:
    path: apps/admin
    runtime: web
    depends_on:
      - gateway_api
    docker: false
    enabled: true
