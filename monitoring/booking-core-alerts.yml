groups:
  - name: booking-core
    rules:
      - alert: BookingCoreUnavailable
        expr: up{job="booking-core"} == 0 or booking_core_database_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Booking Core or its database is unavailable
      - alert: BookingCoreHighErrorRate
        expr: sum(rate(booking_core_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(booking_core_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Booking Core HTTP 5xx rate exceeds 5 percent
      - alert: BookingCoreHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(booking_core_http_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Booking Core p95 latency exceeds one second
