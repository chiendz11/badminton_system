{{- if .Values.dashboards.enabled }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: badminton-{{ $path | base | trimSuffix ".json" }}
  namespace: {{ $.Values.dashboards.namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: badminton
data:
  {{ $path | base }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
