global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/booking-core-alerts.yml
scrape_configs:
  - job_name: booking-core
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/booking_metrics_token
    static_configs:
      - targets: ["api:3000"]
  - job_name: api-gateway
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/gateway_metrics_token
    static_configs:
      - targets: ["gateway:8081"]
