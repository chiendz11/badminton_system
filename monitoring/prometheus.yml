global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/rules/booking-core.yml
  - /etc/prometheus/rules/api-gateway.yml
  - /etc/prometheus/rules/ai-service.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: booking-core
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/booking_metrics_token
    static_configs:
      - targets: ["api:3000"]
        labels:
          service: booking-core
          environment: local
  - job_name: api-gateway
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/gateway_metrics_token
    static_configs:
      - targets: ["gateway:8081"]
        labels:
          service: api-gateway
          environment: local
  - job_name: ai-service
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/ai_metrics_token
    static_configs:
      - targets: ["ai:8000"]
        labels:
          service: ai-service
          environment: local
